<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shop — Time Clocks Unlimited</title>
<meta name="description" content="Shop time clocks, break bell & buzzer systems, biometric terminals, date stamps and genuine supplies from Time Clocks Unlimited, LLC." />
<meta name="theme-color" content="#0a1c2e" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230a1c2e'/%3E%3Cg fill='none' stroke='%23f26a1b' stroke-width='2.2' stroke-linecap='round'%3E%3Ccircle cx='12' cy='12' r='7'/%3E%3Cpath d='M12 8v4l3 1.6'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main id="main"></main>

<script src="catalog.js"></script>
<script src="site.js"></script>
<script>
(function(){
  const id = new URLSearchParams(location.search).get('cat') || CATEGORIES[0].id;
  const cat = getCat(id);
  const main = document.getElementById('main');
  if(!cat){ main.innerHTML='<div class="wrap" style="padding:80px 24px"><h1>Category not found</h1><p><a href="index.html">Back to home</a></p></div>'; return; }
  document.title = cat.name + ' — Time Clocks Unlimited';

  const card = p => cardHTML(p);

  const prods = productsIn(id);
  const brands = [...new Set(prods.map(p=>p.brand).filter(Boolean))].sort();
  // group by sub
  const groups = {};
  prods.forEach(p=>{ const k=p.sub||'__all'; (groups[k]=groups[k]||[]).push(p); });
  const order = cat.subs && cat.subs.length ? cat.subs.concat(['__all']) : Object.keys(groups);
  const seen=new Set();
  let body='';
  order.forEach(k=>{
    if(!groups[k]||seen.has(k)) return; seen.add(k);
    const title = k==='__all' ? null : k;
    body += `<section class="block" style="padding:34px 0 10px"><div class="wrap">
      ${title?`<div class="subhead"><h2>${title}</h2><span class="ln"></span><span class="cnt">${groups[k].length} products</span></div>`:''}
      <div class="prod-grid">${groups[k].map(card).join('')}</div>
    </div></section>`;
  });

  const benefits = (cat.benefits||[]).map(b=>`<div class="benefit reveal"><span class="bi">${icon('check','#fff').replace('width="24" height="24"','width="20" height="20"')}</span><h4>${b.t}</h4><p>${b.d}</p></div>`).join('');
  const benefitBlock = cat.benefits ? `<section class="block" style="padding:40px 0 0"><div class="wrap">
      <div style="text-align:center;max-width:640px;margin:0 auto 8px"><span class="eyebrow">Why NetBell IP Paging</span></div>
      <div class="benefits">${benefits}</div></div></section>` : '';

  main.innerHTML = `
  <div class="cat-hero"><div class="wrap">
    <div class="crumb" style="color:#9fb8cf;padding:0 0 6px"><a href="index.html" style="color:#9fb8cf">Home</a> › <span style="color:#fff">${cat.name}</span></div>
    <h1>${cat.name}</h1>
    <p>${cat.blurb}</p>
    ${cat.subs?`<div class="subchips">${cat.subs.map(s=>`<span class="subchip">${s}</span>`).join('')}</div>`:''}
  </div></div>
  ${benefitBlock}
  ${prods.length ? `<div class="wrap"><div class="toolbar" style="margin-top:30px">
    <span class="count" id="resultCount">${prods.length} products</span>
    <div class="filters">
      ${brands.length>1?`<select id="brandSel" aria-label="Filter by brand"><option value="">All brands</option>${brands.map(b=>`<option value="${b}">${b}</option>`).join('')}</select>`:''}
      <select id="priceSel" aria-label="Filter by price"><option value="">Any price</option><option value="u100">Under $100</option><option value="100-500">$100 – $500</option><option value="500-1000">$500 – $1,000</option><option value="1000">$1,000 +</option></select>
      <select id="sortSel" aria-label="Sort"><option value="pop">Most Popular</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option></select>
    </div>
  </div></div>
  <div id="groups">${body}</div>` : `<section class="block"><div class="wrap"><div class="empty-state">
    <span class="ei">${icon(cat.icon||'phone','currentColor').replace('width="24" height="24"','width="30" height="30"')}</span>
    <h3>Tell us what you need</h3>
    <p>We configure ${cat.name.toLowerCase()} to fit your facility — indoor or outdoor, the right range and signal devices. Call and we'll spec the right setup for you.</p>
    <a href="tel:8887341283" class="btn btn-primary">${icon('phone')} Call 888-734-1283</a>
  </div></div></section>`}
  <section class="block" style="background:var(--bg);margin-top:30px"><div class="wrap" style="text-align:center;max-width:640px">
    <span class="eyebrow">Not sure which model?</span>
    <h2 style="font-size:clamp(24px,3vw,34px);margin:12px 0 12px">Call us — we'll spec it for you.</h2>
    <p style="color:var(--slate);margin-bottom:22px">Personal service direct from the owner is the main difference in our company. Tell us your facility and we'll match the right system.</p>
    <a href="tel:8887341283" class="btn btn-primary">${icon('phone')} Call 888-734-1283</a>
  </div></section>`;

  function observeReveal(){
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.1});
    document.querySelectorAll('.reveal:not(.in)').forEach(el=>io.observe(el));
  }
  observeReveal();

  // filters + sort. Grouped sub-category view only when no filter AND sort = Most Popular; otherwise a flat filtered/sorted grid.
  const brandSel=document.getElementById('brandSel'), priceSel=document.getElementById('priceSel'), sortSel=document.getElementById('sortSel'),
        groupsEl=document.getElementById('groups'), countEl=document.getElementById('resultCount');
  function inPrice(pr,v){ return v==='u100'?pr<100 : v==='100-500'?(pr>=100&&pr<500) : v==='500-1000'?(pr>=500&&pr<1000) : v==='1000'?pr>=1000 : true; }
  function applyView(){
    if(!sortSel) return;
    const bv=brandSel?brandSel.value:'', pv=priceSel.value, sv=sortSel.value;
    let list=prods.filter(p=>(!bv||p.brand===bv)&&inPrice(p.price,pv));
    if(sv==='low') list.sort((a,b)=>a.price-b.price); else if(sv==='high') list.sort((a,b)=>b.price-a.price);
    if(countEl) countEl.textContent = list.length+' product'+(list.length===1?'':'s');
    const filtered = bv||pv;
    if(!filtered && sv==='pop'){ groupsEl.innerHTML=body; }
    else if(!list.length){ groupsEl.innerHTML=`<section class="block"><div class="wrap"><div class="empty-state"><span class="ei">${icon('search','currentColor').replace('width="24" height="24"','width="28" height="28"')}</span><h3>No products match those filters</h3><p>Try widening your price range or brand.</p><button class="btn btn-light" id="clearF">Clear filters</button></div></div></section>`;
      const cf=document.getElementById('clearF'); if(cf) cf.onclick=()=>{ if(brandSel)brandSel.value=''; priceSel.value=''; sortSel.value='pop'; applyView(); }; }
    else { groupsEl.innerHTML=`<section class="block" style="padding:26px 0 10px"><div class="wrap"><div class="prod-grid">${list.map(card).join('')}</div></div></section>`; }
    document.querySelectorAll('.reveal').forEach(el=>el.classList.add('in'));
  }
  [brandSel,priceSel,sortSel].forEach(s=>{ if(s) s.addEventListener('change', applyView); });
})();
</script>
</body>
</html>
