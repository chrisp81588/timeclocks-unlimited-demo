<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Search — Time Clocks Unlimited</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0a1c2e" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230a1c2e'/%3E%3Cg fill='none' stroke='%23f26a1b' stroke-width='2.2' stroke-linecap='round'%3E%3Ccircle cx='12' cy='12' r='7'/%3E%3Cpath d='M12 8v4l3 1.6'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main id="main"></main>
<script src="catalog.js"></script>
<script src="site.js"></script>
<script>
(function(){
  const q=(new URLSearchParams(location.search).get('q')||'').trim();
  const main=document.getElementById('main');
  const results=q?searchProducts(q):[];
  document.title=(q?`"${q}" — `:'')+'Search — Time Clocks Unlimited';

  const card = p => cardHTML(p);

  const grid = results.length
    ? `<div class="prod-grid">${results.map(card).join('')}</div>`
    : `<div class="empty-state"><span class="ei">${icon('search','currentColor').replace('width="24" height="24"','width="30" height="30"')}</span>
       <h3>No matches${q?` for "${q}"`:''}</h3>
       <p>Try a model number (DR2000, MJR-7000), a type (bell, buzzer, ribbon), or a brand (Amano, Widmer, Linortek). Or call us — we'll find it.</p>
       <a href="tel:8887341283" class="btn btn-primary">${icon('phone')} Call 888-734-1283</a></div>`;

  main.innerHTML = `
  <div class="cat-hero"><div class="wrap">
    <div class="crumb" style="color:#9fb8cf;padding:0 0 6px"><a href="index.html" style="color:#9fb8cf">Home</a> › <span style="color:#fff">Search</span></div>
    <h1>Search results</h1>
    <form id="sf" role="search" style="display:flex;gap:10px;max-width:560px;margin-top:18px;background:#fff;border-radius:12px;padding:5px 5px 5px 16px">
      <input id="sq" type="search" value="${q.replace(/"/g,'&quot;')}" placeholder="Search products…" autocomplete="off" aria-label="Search" style="flex:1;border:0;outline:0;font-family:inherit;font-size:16px;color:var(--ink)"/>
      <button class="btn btn-primary" type="submit">Search</button>
    </form>
  </div></div>
  <section class="block"><div class="wrap">
    ${q?`<div class="toolbar"><span class="count">${results.length} result${results.length===1?'':'s'} for "<b>${q}</b>"</span></div>`:''}
    ${grid}
  </div></section>`;

  const sf=document.getElementById('sf');
  sf.addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById('sq').value.trim();location.href='search.html?q='+encodeURIComponent(v);});
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.1});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
})();
</script>
</body>
</html>
