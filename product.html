<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Product — Time Clocks Unlimited</title>
<meta name="description" content="Product details, specifications and pricing from Time Clocks Unlimited, LLC." />
<meta name="theme-color" content="#0a1c2e" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230a1c2e'/%3E%3Cg fill='none' stroke='%23f26a1b' stroke-width='2.2' stroke-linecap='round'%3E%3Ccircle cx='12' cy='12' r='7'/%3E%3Cpath d='M12 8v4l3 1.6'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main id="main"></main>

<script src="catalog.js"></script>
<script src="site.js"></script>
<script>
(function(){
  const sku = new URLSearchParams(location.search).get('sku');
  const p = getProduct(sku);
  const main = document.getElementById('main');
  if(!p){ main.innerHTML='<div class="wrap" style="padding:80px 24px"><h1>Product not found</h1><p><a href="index.html">Back to home</a></p></div>'; return; }
  const cat = getCat(p.cat);
  document.title = p.name + ' — Time Clocks Unlimited';

  const save = (p.list && p.list>p.price) ? p.list-p.price : 0;
  const bullets = (p.bullets||[]).map(b=>`<li>${icon('check','#16a34a').replace('width="24" height="24"','width="18" height="18"')}<span>${b}</span></li>`).join('');
  const specs = p.specs ? `<div class="specs">${Object.entries(p.specs).map(([k,v])=>`<div class="row"><div class="k">${k}</div><div>${v}</div></div>`).join('')}</div>` : '';
  const compat = (p.compat&&p.compat.length) ? `<div class="compat-box"><h4>${icon('check','#f26a1b').replace('width="24" height="24"','width="16" height="16"')} Compatible with</h4><ul>${p.compat.map(c=>`<li>${c}</li>`).join('')}</ul></div>` : '';
  const specChips = p.specs ? `<div class="spec-chips">${Object.entries(p.specs).slice(0,4).map(([k,v])=>`<span class="sc">${k}: ${v}</span>`).join('')}</div>` : '';

  main.innerHTML = `
  <div class="wrap">
    <div class="crumb"><a href="index.html">Home</a> › <a href="category.html?cat=${cat.id}">${cat.name}</a> › <span>${p.name}</span></div>
    <div class="detail">
      <div class="gallery-col reveal">
        <div class="gallery" id="gallery" title="Click to zoom"><img src="${p.img}" alt="${p.name}" onerror="this.onerror=null;this.src='assets/placeholder.svg'" /><span class="zoom-hint">${icon('search').replace('width="24" height="24"','width="15" height="15"')} Click to zoom</span></div>
        ${specChips}
      </div>
      <div class="info reveal">
        <span class="cat-tag">${p.brand||cat.short}${p.model? ' · '+p.model : ''}</span>
        <h1>${p.name}</h1>
        <div class="pricebox">
          <span class="price">${fmt(p.price)}</span>
          ${p.list&&p.list>p.price?`<span class="was">${fmt(p.list)}</span>`:''}
          ${save?`<span class="save">You save $${save}</span>`:''}
        </div>
        <p class="desc">${p.short||''}</p>
        ${bullets?`<ul class="bul">${bullets}</ul>`:''}
        <div class="qtyrow"><span class="qlbl">Qty</span><div class="qty"><button type="button" id="qtyDec" aria-label="Decrease quantity">−</button><span id="qtyVal">1</span><button type="button" id="qtyInc" aria-label="Increase quantity">+</button></div><span class="stock" style="margin-top:0"><span class="sdot"></span> In stock · ships 1–2 business days</span></div>
        <div class="actions">
          <button class="btn btn-primary" id="pdpAdd">Add to Cart ${icon('cart').replace('width="24" height="24"','width="16" height="16"')}</button>
          <a href="tel:8887341283" class="btn btn-light">${icon('phone').replace('width="24" height="24"','width="16" height="16"')} Call to order</a>
        </div>
        <div class="assure">
          <span class="a">${icon('check','#16a34a').replace('width="24" height="24"','width="18" height="18"')} Authorized ${p.brand||'factory'} dealer</span>
          <span class="a">${icon('wrench').replace('width="24" height="24"','width="18" height="18"')} We service what we sell</span>
          <span class="a">${icon('truck').replace('width="24" height="24"','width="18" height="18"')} Ships via UPS · rates at checkout</span>
          <span class="a">${icon('phone').replace('width="24" height="24"','width="18" height="18"')} Owner-direct support</span>
        </div>
        ${specs}
        ${compat}
        ${p.desc?`<p class="desc">${p.desc}</p>`:''}
      </div>
    </div>
  </div>
  <section class="block"><div class="wrap">
    <div class="subhead"><h2>More from ${cat.name}</h2><span class="ln"></span><a class="cnt" href="category.html?cat=${cat.id}" style="color:var(--orange-dark)">View all →</a></div>
    <div class="prod-grid" id="related"></div>
  </div></section>`;

  // related: up to 4 others in same category
  const rel = productsIn(p.cat).filter(x=>x.id!==p.id).slice(0,4);
  document.getElementById('related').innerHTML = rel.map(cardHTML).join('');

  // quantity stepper + qty-aware add to cart
  let qty=1; const qv=document.getElementById('qtyVal');
  document.getElementById('qtyInc').onclick=()=>{qty++;qv.textContent=qty;};
  document.getElementById('qtyDec').onclick=()=>{if(qty>1){qty--;qv.textContent=qty;}};
  document.getElementById('pdpAdd').onclick=()=>{
    window.Cart.add(p.id, qty);
    const b=document.getElementById('pdpAdd'), t=b.innerHTML;
    b.style.background='#16a34a'; b.innerHTML='Added '+qty+' to cart ✓';
    setTimeout(()=>{b.innerHTML=t;b.style.background='';},1300);
  };

  // click-to-zoom lightbox
  const g=document.getElementById('gallery');
  if(g) g.addEventListener('click',()=>{
    const ov=document.createElement('div'); ov.className='lightbox';
    ov.innerHTML=`<img src="${p.img}" alt="${p.name}"/>`;
    const close=()=>{ov.remove();document.removeEventListener('keydown',onKey);};
    function onKey(e){ if(e.key==='Escape') close(); }
    ov.addEventListener('click',close); document.addEventListener('keydown',onKey);
    document.body.appendChild(ov);
  });

  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.1});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
  window.scrollTo(0,0);
})();
</script>
</body>
</html>
